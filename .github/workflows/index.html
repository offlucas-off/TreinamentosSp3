<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Treinamento Portal Infinity - SP3</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    /* Menu superior */
    header {
      height: 64px;
      background-color: #111827;
      color: #ffffff;
      display: flex;
      align-items: center;
      padding: 0 24px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* Área do Canva ocupa todo o restante da tela */
    main {
      height: calc(100vh - 64px);
      width: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <header>
    Treinamento Portal Infinity - SP3
  </header>

  <main>
    <iframe
      loading="lazy"
      src="https://www.canva.com/design/DAHKyDenZFQ/WjPJEFEnRqt2t_avqrPqdg/view?embed"
      allowfullscreen="allowfullscreen"
      allow="fullscreen">
    </iframe>
  </main>

</body>
</html>
